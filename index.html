<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E3B46">
<title>유럽 신혼여행 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신혼여행">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#FAF8F4; --card:#fff; --ink:#25313B; --muted:#6C7780; --line:#E7E2D8; --accent:#8E3B46; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151A20; --card:#1D242C; --ink:#E7E4DC; --muted:#96A1AB; --line:#2C353E; --accent:#D98894; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif; }
  .lock { width:min(340px, 88vw); background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:30px 26px; text-align:center; }
  .heart { font-size:40px; }
  h1 { font-size:19px; margin:10px 0 2px; letter-spacing:-0.02em; }
  .sub { font-size:12.5px; color:var(--muted); margin-bottom:20px; }
  input[type=password] { width:100%; font:inherit; font-size:17px; text-align:center; letter-spacing:.06em;
    padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input:focus-visible { outline:2px solid var(--accent); }
  .rem { display:flex; align-items:center; justify-content:center; gap:7px; font-size:12.5px; color:var(--muted); margin:13px 0 15px; }
  .rem input { width:17px; height:17px; accent-color:var(--accent); }
  button { width:100%; font:inherit; font-size:15px; font-weight:700; padding:12px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer; }
  .err { font-size:12.5px; color:#C0392B; min-height:18px; margin-top:11px; }
  .foot { font-size:11px; color:var(--muted); margin-top:14px; }
</style>
</head>
<body>
<form class="lock" id="f">
  <div class="heart">💍</div>
  <h1>유럽 신혼여행 2026</h1>
  <div class="sub">우리 둘만 보는 앱입니다 · 비밀번호를 입력하세요</div>
  <input type="password" id="pw" inputmode="text" autocomplete="current-password" placeholder="비밀번호">
  <label class="rem"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
  <button type="submit">열기</button>
  <div class="err" id="err"></div>
  <div class="foot">내용은 AES-256으로 암호화되어 있어 비밀번호 없이는 읽을 수 없습니다</div>
</form>

<script>
(function () {
  "use strict";
  var SALT = "Q6HRQXJVoQoivT2XYCZjvw==", IV = "KKZ578KTZFJ44qW9", ITER = 310000;
  function ab(b64s) {
    var bin = atob(b64s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  var salt = ab(SALT), iv = ab(IV);
  var ct = ab(document.getElementById("ct").textContent.trim());

  function render(htmlText) {
    document.open(); document.write(htmlText); document.close();
  }
  function decryptWithKey(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct)
      .then(function (pt) { render(new TextDecoder().decode(pt)); });
  }
  function deriveKey(pwStr) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pwStr), "PBKDF2", false, ["deriveKey"])
      .then(function (km) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
          km, { name: "AES-GCM", length: 256 }, true, ["decrypt", "encrypt"]);
      });
  }

  /* 저장된 키가 있으면 바로 연다 — 단, 파싱이 끝난 뒤에.
     로딩 중 document.write는 교체가 아니라 삽입이 되어 잠금화면과 앱이 겹칩니다. */
  function autoUnlock() {
    var saved = null;
    try { saved = localStorage.getItem("hm.key"); } catch (e) {}
    if (!saved) return;
    crypto.subtle.importKey("raw", ab(saved), { name: "AES-GCM" }, true, ["decrypt"])
      .then(decryptWithKey)
      .catch(function () { try { localStorage.removeItem("hm.key"); } catch (e) {} });
  }
  if (document.readyState === "complete") autoUnlock();
  else window.addEventListener("load", autoUnlock);

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var err = document.getElementById("err");
    err.textContent = "확인 중...";
    var pwStr = document.getElementById("pw").value.trim();
    deriveKey(pwStr).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct).then(function (pt) {
        if (document.getElementById("rem").checked) {
          crypto.subtle.exportKey("raw", key).then(function (raw) {
            var b = ""; var u = new Uint8Array(raw);
            for (var i = 0; i < u.length; i++) b += String.fromCharCode(u[i]);
            try { localStorage.setItem("hm.key", btoa(b)); } catch (e) {}
            render(new TextDecoder().decode(pt));
          });
        } else {
          render(new TextDecoder().decode(pt));
        }
      });
    }).catch(function () {
      err.textContent = "비밀번호가 맞지 않습니다. 다시 확인해 주세요.";
    });
  });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
})();
